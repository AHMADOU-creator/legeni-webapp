- hosts: local
  vars_files: ["vars/{{ target_env }}.yml", "vars/vault.yml"]
  vars:
    image: ahmadoungb/legeni-webapp
    expected_version: "{{ image_tag.split('-')[0] }}"
  tasks:
    - block:
        - name: Namespace
          kubernetes.core.k8s:
            definition: { apiVersion: v1, kind: Namespace, metadata: { name: "{{ namespace }}" } }
        - name: Appliquer les manifests
          kubernetes.core.k8s:
            state: present
            template: "k8s/{{ item }}"
          loop: [redis.yml.j2, app.yml.j2]
        - name: Attendre la fin du rolling update
          command: kubectl rollout status deployment/legeni-app -n {{ namespace }} --timeout=90s
          changed_when: false
        - name: IP du noeud
          shell: kubectl get nodes -o jsonpath='{.items[0].status.addresses[0].address}'
          register: nodeip
          changed_when: false
        - name: Smoke test, la version doit etre la bonne
          uri:
            url: "http://{{ nodeip.stdout }}:{{ node_port }}/api/info"
            return_content: true
          register: r
          retries: 5
          delay: 3
          until: r.status is defined and r.status == 200
          failed_when: expected_version not in (r.content | default(''))
      rescue:
        - name: Rollback automatique
          command: kubectl rollout undo deployment/legeni-app -n {{ namespace }}
          ignore_errors: true
        - name: Echec du deploiement
          fail: { msg: "Deploiement rate, rollback effectue" }
